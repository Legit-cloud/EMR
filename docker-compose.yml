x-app: &app
  build:
    context: .
    target: dev
  image: emr-dev
  env_file:
    - path: .env
      required: false
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.local
    SECRET_KEY: ${SECRET_KEY:-local-dev-only-not-a-secret}
    DATABASE_URL: postgres://emr:emr@db:5432/emr
    REDIS_URL: redis://redis:6379/0
    EMAIL_URL: smtp://mailpit:1025
    # The browser reaches Django through the edge proxy (http://localhost:8080 or http://edge).
    ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,web,edge
    CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://edge
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    command: sh -c "python manage.py migrate --noinput && uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${WEB_PORT:-8000}:8000"

  worker:
    <<: *app
    command: celery -A config worker -l info --concurrency 2

  beat:
    <<: *app
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: emr
      POSTGRES_USER: emr
      POSTGRES_PASSWORD: emr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emr -d emr"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Next.js app (production build).
  frontend:
    build: ./frontend
    image: emr-frontend
    depends_on:
      - web

  # One origin for the browser: /api, /ws, /admin to Django, everything else to Next.js.
  edge:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${EDGE_PORT:-8080}:80"
    depends_on:
      - web
      - frontend

  # Frontend checks and tools in Node, so nothing needs installing on the host:
  #   docker compose run --rm frontend-tools               (pnpm check)
  #   docker compose run --rm frontend-tools pnpm format
  frontend-tools:
    image: node:22-bookworm-slim
    profiles: ["tools"]
    working_dir: /app
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      CI: "1"
      # Keep the package store in its volume, not in the bind-mounted source folder.
      npm_config_store_dir: /pnpm-store
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - pnpm-store:/pnpm-store
    entrypoint:
      - sh
      - -c
      - corepack enable && pnpm install --frozen-lockfile --prefer-offline >/dev/null && exec "$$@"
      - --
    command: ["pnpm", "check"]

  # Browser tests: `make e2e`.
  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: ["e2e"]
    working_dir: /work
    volumes:
      - ./frontend:/work
      - playwright-node-modules:/work/node_modules
      - pnpm-store:/pnpm-store
    environment:
      BASE_URL: http://edge
      CI: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      npm_config_store_dir: /pnpm-store
    command: sh -c "corepack enable && pnpm install --frozen-lockfile >/dev/null && pnpm e2e"
    depends_on:
      - edge

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_PORT:-8026}:8025"

volumes:
  pgdata:
  playwright-node-modules:
  frontend-node-modules:
  pnpm-store:
