            schema:
              $ref: '#/components/schemas/OTPTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPTokenRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnabled'
