openapi: 3.0.3
info:
  title: EMR API
  version: 0.1.0
paths:
  /api/accounts/auth/csrf/:
    get:
      operationId: accounts_auth_csrf_retrieve
      description: Sets the CSRF cookie for the web app before a session sign-in.
      tags:
      - accounts
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: ''
  /api/accounts/auth/login/:
    post:
      operationId: accounts_auth_login_create
      description: Sign in with password and, when set up, a one-time code. Session
        or bearer token.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          description: ''
  /api/accounts/auth/logout/:
    post:
      operationId: accounts_auth_logout_create
      tags:
      - accounts
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/accounts/auth/me/:
    get:
      operationId: accounts_auth_me_retrieve
      tags:
      - accounts
      security:
