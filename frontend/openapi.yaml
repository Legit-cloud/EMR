  /api/accounts/break-glass/patients/{patient_id}/:
    get:
      operationId: accounts_break_glass_patients_retrieve
      description: |-
        Tells the chart whether some of a patient's records are outside the user's access,
        so it can offer patient-level break-glass, and shows any grant already open.
      parameters:
      - in: path
        name: patient_id
        schema:
          type: string
          format: uuid
        required: true
