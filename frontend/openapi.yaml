components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 10
        name:
          type: string
          maxLength: 100
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        balance_minor:
          type: integer
          readOnly: true
      required:
      - account_type
      - balance_minor
      - code
      - id
      - name
    AccountTypeEnum:
      enum:
      - asset
      - liability
      - equity
      - revenue
      - expense
      type: string
      description: |-
        * `asset` - Asset
        * `liability` - Liability
        * `equity` - Equity
        * `revenue` - Revenue
        * `expense` - Expense
    ActionEnum:
      enum:
      - read
      - create
      - update
      - delete
      - access
      - login
      - login_failed
      - logout
      - mfa_enrol
      - mfa_confirm
      - password_reset_request
      - password_reset
      - break_glass
      - break_glass_review
      type: string
      description: |-
        * `read` - Read
        * `create` - Create
        * `update` - Update
        * `delete` - Delete
        * `access` - Access
        * `login` - Login
        * `login_failed` - Login failed
        * `logout` - Logout
        * `mfa_enrol` - MFA enrolment started
        * `mfa_confirm` - MFA device confirmed
        * `password_reset_request` - Password reset requested
        * `password_reset` - Password reset
        * `break_glass` - Break-glass access
        * `break_glass_review` - Break-glass review
    Allergy:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        patient:
          type: string
          format: uuid
        substance:
          type: string
          maxLength: 200
        substance_code:
          type: string
          maxLength: 64
        category:
          $ref: '#/components/schemas/AllergyCategoryEnum'
        reaction:
          type: string
          maxLength: 500
        severity:
          $ref: '#/components/schemas/AllergySeverityEnum'
        onset_date:
          type: string
          format: date
          nullable: true
        note:
          type: string
        record_state:
          allOf:
          - $ref: '#/components/schemas/RecordStateEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - created_at
      - id
      - patient
      - reaction
      - record_state
      - severity
      - substance
    AllergyCategoryEnum:
      enum:
      - medication
      - food
      - environment
      - biologic
      type: string
      description: |-
        * `medication` - Medication
        * `food` - Food
        * `environment` - Environment
        * `biologic` - Biologic
    AllergyChip:
      type: object
      properties:
        substance:
          type: string
        severity:
          type: string
      required:
      - severity
      - substance
    AllergyRequest:
      type: object
      properties:
        patient:
          type: string
          format: uuid
        substance:
          type: string
          minLength: 1
          maxLength: 200
        substance_code:
          type: string
          maxLength: 64
        category:
          $ref: '#/components/schemas/AllergyCategoryEnum'
        reaction:
          type: string
          minLength: 1
          maxLength: 500
        severity:
          $ref: '#/components/schemas/AllergySeverityEnum'
        onset_date:
          type: string
          format: date
          nullable: true
        note:
          type: string
      required:
      - category
      - patient
      - reaction
      - severity
      - substance
    AllergySeverityEnum:
      enum:
      - mild
      - moderate
      - severe
      type: string
      description: |-
        * `mild` - Mild
        * `moderate` - Moderate
        * `severe` - Severe
    Appointment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        patient:
          type: string
          format: uuid
        patient_name:
          type: string
          readOnly: true
          description: The patient's name, for calendars and lists.
        patient_mrn:
          type: string
          readOnly: true
        physician:
          type: string
          format: uuid
        facility:
          type: string
          format: uuid
        department:
          type: string
          format: uuid
          nullable: true
        appointment_type:
          $ref: '#/components/schemas/AppointmentTypeEnum'
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        status:
          allOf:
          - $ref: '#/components/schemas/AppointmentStatusEnum'
          readOnly: true
        reason:
          type: string
          maxLength: 500
        cancellation_reason:
          type: string
          readOnly: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        triage_priority:
          type: integer
          readOnly: true
          nullable: true
        checked_in_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        checked_in_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        consultation_started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        encounter_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        series_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - appointment_type
      - cancellation_reason
      - cancelled_at
      - checked_in_at
      - checked_in_by
      - completed_at
      - consultation_started_at
      - created_at
      - encounter_id
      - facility
      - id
      - patient
      - patient_mrn
      - patient_name
      - physician
      - series_id
      - start_at
      - status
      - triage_priority
    AppointmentRequest:
      type: object
      properties:
        patient:
          type: string
          format: uuid
