# Railway config for the web service.
# Worker and beat use the same image with their own config files in deploy/railway/
# (set "Config file path" on those services in the Railway dashboard).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'gunicorn config.asgi:application -k uvicorn_worker.UvicornWorker --bind 0.0.0.0:${PORT:-8000} --workers ${WEB_CONCURRENCY:-3}'"
preDeployCommand = ["python manage.py migrate --noinput"]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
